<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/maven-icon.svg" type="image/svg+xml">
<title>The Last Loan | MAVEN Mystery Seasons</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fdfbf5;color:#222334;font:16px system-ui}header{padding:1rem 5%;background:#183c65;color:white;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}header a{color:white}main{max-width:1200px;margin:2rem auto;padding:0 1rem}h1,h2,h3{font-family:Georgia,serif;color:#183c65}button,input,textarea{font:inherit;padding:.65rem;border:1px solid #183c65;border-radius:.25rem}button{background:#183c65;color:white;cursor:pointer}button:disabled{opacity:.55;cursor:default}label{display:block;margin:.6rem 0}fieldset,article,details{border:1px solid #b79a68;padding:1rem;margin:1rem 0}legend{font-weight:bold}a{color:#183c65}video{width:100%;max-width:900px;background:#152238}nav{display:flex;gap:.6rem;flex-wrap:wrap}textarea{width:100%;min-height:5rem}.status{min-height:1.5rem;color:#183c65}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.actions{display:flex;gap:.5rem;flex-wrap:wrap}.rejoin{overflow-wrap:anywhere}
#briefing-view{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#080b10;color:white;overflow:hidden}
#briefing-view::backdrop{background:#080b10}
#briefing-view video,#briefing-view canvas{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:contain;background:#080b10;pointer-events:none}
#briefing-message{position:absolute;inset:auto 1rem 1rem;text-align:center}
#briefing-message p{width:fit-content;margin:.5rem auto;padding:.35rem .65rem;background:#080b10}
#briefing-message p:empty{display:none}
#pdf-view{width:min(96%,65rem);height:92dvh;max-width:none;max-height:none;border:1px solid #b79a68;background:#fdfbf5;padding:0}
#pdf-view::backdrop{background:#080b10bb}
#pdf-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.75rem;background:#e8edf2}
#pdf-title{flex:1 0 100%;margin:0}
#pdf-pages{height:100%;overflow:auto;padding:.5rem;background:#dce2e9;touch-action:pan-x pan-y pinch-zoom}
#pdf-pages canvas{display:block;margin:auto;background:white}
#pdf-layout{display:flex;flex-direction:column;height:100%;min-height:0}
button[aria-pressed=true]{outline:2px solid #b79a68;outline-offset:2px}
</style>
</head>
<body>
<header><a href="/products">MAVEN Publications</a><strong>MAVEN Police Department</strong><a href="/account#products/seasons">My products</a></header>
<main>
<h1>The Last Loan</h1>
<p>Season 1 · Episode 1 · High-Value Theft</p>
<p id="status" class="status" role="status"></p>
<div id="entry"></div><div id="session" hidden>
<h2 id="room-heading"></h2><p id="phase"></p><p id="rejoin" class="rejoin"></p>
<div id="controls"></div><div id="screen"></div><div id="workspace"></div>
</div>
</main>
<dialog id="briefing-view" aria-label="The Last Loan briefing">
  <video playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
  <canvas hidden aria-hidden="true"></canvas>
  <div id="briefing-message"><p role="status"></p><button type="button" hidden></button></div>
</dialog>
<dialog id="pdf-view" aria-labelledby="pdf-title">
  <div id="pdf-layout">
    <div id="pdf-toolbar">
      <h2 id="pdf-title"></h2>
      <button id="pdf-prev" type="button" disabled>Previous</button>
      <button id="pdf-next" type="button" disabled>Next</button>
      <button id="pdf-zoom" type="button" aria-pressed="false" disabled>Zoom in</button>
      <button id="pdf-close" type="button" autofocus>Close</button>
      <span id="pdf-status" role="status"></span>
    </div>
    <div id="pdf-pages"><canvas hidden></canvas></div>
  </div>
</dialog>
<script type="module">
import {briefing, transcript, credit, reactionFiles, caseTitles} from '/seasons-content.mjs';
const $ = id=>document.getElementById(id);
const params = new URLSearchParams(location.search);
const isHost = params.get('host')==='1';
const isProduct = params.get('product')==='1';
let room = params.get('room')||'', secret = '', privateCode = '', lastControls='', lastFiles='', activeReaction='', activeFile=null;
let state, refreshing=false;
const make = (tag,text) => {const e=document.createElement(tag);if(text)e.textContent=text;return e;};
const report = message => {$('status').textContent=message;};
const safely = handler => async (...args)=>{try{await handler(...args);}catch(error){report(error.message);}};
function button(text,run) {
  const e=make('button',text);e.type='button';
  e.onclick=safely(async()=>{e.disabled=true;try{await run();}finally{e.disabled=false;}});
  return e;
}
const endpoint = (action, extra={})=>'/api/seasons/'+action+'?'+new URLSearchParams({room,...extra});
const asset = name=>endpoint(isProduct?'product':'asset',{name});
async function api(action, payload) {
  const response=await fetch(endpoint(action),{method:payload?'POST':'GET',headers:{...(payload?{'content-type':'application/json'}:{}),...(secret?{'x-room-credential':secret}:{})},...(payload?{body:JSON.stringify(payload)}:{})});
  const result=await response.json();
  if(!response.ok) throw Error(result.error||'Request failed.');
  return result;
}
async function readAsset(name,signal) {
  const response=await fetch(asset(name),{signal,headers:secret?{'x-room-credential':secret}:{}});
  if(!response.ok){
    const failure=await response.json().catch(()=>({}));
    throw Error(failure.error||'This material is unavailable.');
  }
  return response;
}
const pdfView=$('pdf-view');
let pdfLibrary;
async function viewPdf(title,name,{firstPage=1,lastPage}={}){
  const status=$('pdf-status'), canvas=pdfView.querySelector('canvas'), pages=$('pdf-pages');
  const previous=$('pdf-prev'), next=$('pdf-next'), zoom=$('pdf-zoom');
  const abort=new AbortController();
  let loading, documentPdf, rendering, pageNumber=firstPage, enlarged=false;
  $('pdf-title').textContent=title;
  status.textContent='Loading document…';
  canvas.hidden=true;
  zoom.textContent='Zoom in';zoom.setAttribute('aria-pressed','false');
  previous.hidden=next.hidden=firstPage===lastPage;
  previous.disabled=next.disabled=zoom.disabled=true;
  pdfView.addEventListener('close',()=>{
    abort.abort();
    rendering?.cancel();
    loading?.destroy().catch(()=>{});
    canvas.width=canvas.height=0;
  },{once:true});
  async function draw(){
    previous.disabled=next.disabled=zoom.disabled=true;
    try{
      const page=await documentPdf.getPage(pageNumber);
      if(abort.signal.aborted)return;
      const width=Math.max(1,pages.clientWidth-18)*(enlarged?1.75:1);
      const pixelRatio=Math.min(devicePixelRatio||1,2);
      const viewport=page.getViewport({scale:width*pixelRatio/page.getViewport({scale:1}).width});
      canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);
      canvas.style.width=width+'px';
      rendering=page.render({canvasContext:canvas.getContext('2d'),viewport});
      await rendering.promise;
      if(abort.signal.aborted)return;
      canvas.hidden=false;pages.scrollTop=0;pages.scrollLeft=0;
      const endPage=Math.min(lastPage??documentPdf.numPages,documentPdf.numPages);
      status.textContent=firstPage===lastPage?'Evidence page '+pageNumber:'Page '+pageNumber+' of '+endPage;
      previous.disabled=pageNumber<=firstPage;next.disabled=pageNumber>=endPage;zoom.disabled=false;
    }catch(error){if(!abort.signal.aborted)status.textContent='This page could not be displayed.';}
  }
  $('pdf-close').onclick=()=>pdfView.close();
  previous.onclick=()=>{pageNumber--;void draw();};
  next.onclick=()=>{pageNumber++;void draw();};
  zoom.onclick=()=>{
    enlarged=!enlarged;
    zoom.textContent=enlarged?'Fit width':'Zoom in';zoom.setAttribute('aria-pressed',String(enlarged));
    void draw();
  };
  pdfView.showModal();
  try{
    pdfLibrary??=import('/pdf-viewer/pdf.min.mjs').catch(error=>{pdfLibrary=undefined;throw error;});
    const [pdf,data]=await Promise.all([pdfLibrary,readAsset(name,abort.signal).then(response=>response.arrayBuffer())]);
    if(abort.signal.aborted)return;
    pdf.GlobalWorkerOptions.workerSrc='/pdf-viewer/pdf.worker.min.mjs';
    loading=pdf.getDocument({data,isEvalSupported:false});
    documentPdf=await loading.promise;
    if(!abort.signal.aborted)await draw();
  }catch(error){if(!abort.signal.aborted)status.textContent=error.message||'This document could not be opened.';}
}
function link(label,name){
  if(name.endsWith('.pdf'))return button(label,()=>viewPdf(label,name));
  const a=make('a',label); a.href=asset(name); a.target='_blank'; a.rel='noopener'; return a;
}
function showText(label,name) {
  return button(label,async()=>{
    const response=await readAsset(name);
    const section=make('article');section.append(make('h3',label),make('pre',await response.text()),button('Close',()=>section.remove()));
    $('screen').append(section);
  });
}
async function update(type,extra={}){
  render(await api('room',{type,...extra})); report('');
}
function setRoom(code,credential='',rejoin=''){
  room=code;secret=credential;privateCode=rejoin;
  if(credential){
    sessionStorage.setItem('seasons:'+room,credential);
    sessionStorage.setItem('seasons-rejoin:'+room,rejoin);
  }
  params.set('room',room);history.replaceState(null,'','?'+params);refresh();
}
async function refresh(){
  if(!room||refreshing)return;
  refreshing=true;
  try{render(await api('state'));}catch(error){report(error.message);}finally{refreshing=false;}
}
const briefingView=$('briefing-view');
briefingView.addEventListener('cancel',event=>event.preventDefault());
async function playBriefing(){
  if(briefingView.open)return;
  const video=briefingView.querySelector('video');
  const frame=briefingView.querySelector('canvas');
  const message=briefingView.querySelector('[role=status]');
  const retry=briefingView.querySelector('button');
  const clips=briefing.map(clip=>clip.filename), pending=new Map();
  let index=0, source='', started=false;
  const prefetch=position=>{
    if(position>=clips.length||pending.has(position))return;
    pending.set(position,readAsset(clips[position]).then(response=>response.blob())
      .then(blob=>({blob}),error=>({error})));
  };
  const waitForHost=(label,description,action)=>{
    message.textContent=description;
    retry.textContent=label;
    retry.hidden=false;
    retry.onclick=()=>{retry.hidden=true;void action();};
  };
  const finish=async()=>{
    try{
      await update('briefing-shown');
      video.removeAttribute('src');video.load();
      if(source)URL.revokeObjectURL(source);
      frame.hidden=true;
      pending.clear();
      briefingView.close();
    }catch(error){waitForHost('Return to host management',error.message,finish);}
  };
  const startClip=async()=>{
    message.textContent=index===0?'Loading briefing…':'';
    prefetch(index);
    const {blob,error}=await pending.get(index);
    pending.delete(index);
    if(error){waitForHost('Retry briefing clip',error.message,startClip);return;}
    const previous=source;
    source=URL.createObjectURL(blob);
    video.src=source;
    if(previous)URL.revokeObjectURL(previous);
    prefetch(index+1);
    prefetch(index+2);
    await resume();
  };
  const resume=async()=>{
    try{await video.play();}
    catch(error){
      if(!video.error)waitForHost('Resume briefing','Tap to continue playback.',resume);
    }
  };
  video.onplaying=()=>{frame.hidden=true;message.textContent='';retry.hidden=true;};
  video.onerror=()=>waitForHost('Retry briefing clip','This clip could not be played.',startClip);
  video.onended=()=>{
    if(video.videoWidth&&video.videoHeight){
      frame.width=video.videoWidth;frame.height=video.videoHeight;
      frame.getContext('2d').drawImage(video,0,0);
      frame.hidden=false;
    }
    index++;
    if(index<clips.length)void startClip();
    else void finish();
  };
  const begin=async()=>{
    message.textContent='Loading briefing…';
    try{
      if(!started){await update('briefing');started=true;}
      prefetch(0);
      prefetch(1);
      await startClip();
    }catch(error){waitForHost('Retry briefing',error.message,begin);}
  };
  briefingView.showModal();
  await begin();
}
function play(clips,title,finished){
  const box=make('article'), video=make('video'), heading=make('h3',title);
  let index=0;
  video.controls=true;video.playsInline=true;video.preload='auto';
  const fullscreen=button('Open full screen',async()=>{if(video.requestFullscreen)await video.requestFullscreen();else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();});
  const start=()=>{video.src=asset(clips[index]);video.play().catch(()=>{});};
  video.addEventListener('ended',safely(async()=>{
    index++;
    if(index<clips.length)start();
    else{video.hidden=true;await finished?.();}
  }));
  video.addEventListener('error',()=>report('Video unavailable. Ask the host to check the media upload.'));
  box.append(heading,video,fullscreen,button('Close player',()=>{video.pause();box.remove();}));
  $('screen').append(box);start();
}
function render(next){
  state=next;
  $('entry').hidden=true;$('session').hidden=false;
  $('room-heading').textContent='Room '+room;
  $('phase').textContent=({briefing:'Briefing Room',investigation:'Investigation',deduction:'Final deduction',feedback:'Host feedback',closed:'Case closed'})[state.phase];
  $('rejoin').textContent=privateCode?'Private rejoin code · '+privateCode:secret?'Rejoin with your existing code to receive a six-character code.':'';
  const signature=JSON.stringify([state.phase,state.briefing,state.audit,state.outcome,state.reveal,state.players,state.player?.files]);
  if(signature!==lastControls){lastControls=signature;renderControls();}
  if(state.reaction?.active && activeReaction!==state.reaction.id){
    activeReaction=state.reaction.id;
    play([reactionFiles[state.outcome]+'.mp4'],'Chief Vance',isHost?()=>update('reaction-shown',{id:activeReaction}):null);
  }
  const files=JSON.stringify([state.player?.files,state.phase]);
  if(files!==lastFiles && state.player){lastFiles=files;renderWorkspace(state.player);}
}
function renderControls(){
  const controls=$('controls');controls.replaceChildren();
  if(isHost && state.players){
    const covered=new Set(state.players.flatMap(p=>p.files)).size;
    controls.append(make('h3','Player roster'),make('p',covered+' of 6 files assigned'));
    for(const player of state.players){
      const group=make('fieldset');group.append(make('legend',player.name));
      const picks=caseTitles.map(([id,title])=>{
        const label=make('label'),input=make('input');input.type='checkbox';input.value=Number(id);input.checked=player.files.includes(Number(id));
        const current=state.players.find(p=>p.files.includes(Number(id)));
        label.append(input,document.createTextNode(' '+id+' · '+title+(current&&current.id!==player.id?' · '+current.name:'')));group.append(label);return input;
      });
      if(state.phase!=='closed')group.append(button('Save assignment',()=>update('assign',{player:player.id,files:picks.filter(i=>i.checked).map(i=>Number(i.value))})),button('Assign all six',()=>update('assign',{player:player.id,files:[1,2,3,4,5,6]})));
      controls.append(group);
    }
    const actions=make('div');actions.className='actions';
    if(state.briefing==='ready')actions.append(button('Start briefing',playBriefing));
    if(state.briefing==='playing')actions.append(button('Mark briefing shown',()=>update('briefing-shown')));
    if(state.phase==='briefing'&&state.briefing==='shown'){
      const start=button('Start Investigation',()=>update('start'));start.disabled=covered!==6;actions.append(start);
    }
    if(state.phase==='investigation'&&!state.audit)actions.append(button('Unlock audit after discussion of all six files',()=>update('audit')));
    if(state.phase==='investigation'&&state.audit)actions.append(button('Receive final deduction',()=>update('submit')));
    if(state.phase==='deduction'){
      for(const [label,outcome] of [['Correct','CORRECT'],['Wrong — Keep Investigating','WRONG_RETRY'],['Convict Anyway','CONVICT_ANYWAY']]){
        actions.append(button(label,()=>update('outcome',{outcome})));
      }
    }
    if(state.phase==='feedback') {
      controls.append(make('p','Use the Master Solution to explain a contradiction without revealing the answer.'));
      actions.append(button('Replay wrong deduction reaction',()=>update('outcome',{outcome:'WRONG_RETRY'})),button('Resume investigation',()=>update('resume')));
    }
    if(state.phase==='closed'&&state.outcome==='CORRECT'&&!state.reveal)actions.append(button('Authorise solution reveal',()=>update('reveal')));
    controls.append(actions);
    const hostLinks=make('nav');hostLinks.append(link('Host briefing guide','host-guide.pdf'),link('Master Solution · Host only','solution.pdf'),link('Host HTML','host.html'));controls.append(hostLinks);
  }
  const review=make('nav');review.append(link('Start Here','start.pdf'));
  if(state.briefing==='shown'){
    review.append(showText('Read Briefing Transcript',transcript),showText('Music credits',credit));
    for(const clip of briefing.filter(c=>c.review_after_briefing))review.append(button(clip.label,()=>play([clip.filename],clip.label)));
  }
  if(state.audit)review.append(link('Open Evidence Audit','audit.pdf'));
  if(state.outcome)review.append(showText('Read Chief’s Reaction',reactionFiles[state.outcome]+'.txt'));
  if(state.reveal)review.append(make('p','The host has authorised the solution reveal.'));
  controls.append(review);
}
function renderWorkspace(player){
  const root=$('workspace');root.replaceChildren();
  if(!player.files.length){root.append(make('p','Your assigned case files will open when the host starts the investigation.'));return;}
  const nav=make('nav');root.append(nav);
  const pane=make('article');
  root.append(pane);
  function openFile(file){
    activeFile=file;
    for(const tab of nav.querySelectorAll('button'))tab.setAttribute('aria-pressed',String(Number(tab.dataset.file)===file));
    const [,title]=caseTitles[file-1], prompts=player.prompts[file], journal=make('section');
    const submenu=make('nav');
    submenu.setAttribute('aria-label','Case File '+file+' contents');
    for(let page=1;page<=10;page++){
      const label='Evidence '+String(page).padStart(2,'0');
      submenu.append(button(label,()=>viewPdf(title+' · '+label,'case-'+file+'.pdf',{firstPage:page,lastPage:page})));
    }
    journal.hidden=true;
    const journalButton=button('Investigation Journal',()=>{
      journal.hidden=!journal.hidden;
      journalButton.setAttribute('aria-expanded',String(!journal.hidden));
      if(!journal.hidden)journal.querySelector('textarea')?.focus();
    });
    journal.id='case-journal-'+file;
    journalButton.setAttribute('aria-controls',journal.id);
    journalButton.setAttribute('aria-expanded','false');
    submenu.append(journalButton);
    const draftKey='journal:'+room+':'+secret+':'+file;
    const initial=JSON.parse(sessionStorage.getItem(draftKey)||'null')||state.player.journals[file]?.answers||[];
    journal.append(make('h3','Investigation Journal '+file),make('p','Answer each prompt or explain what the evidence does not establish.'));
    const fields=prompts.map((prompt,index)=>{
      const label=make('label',prompt),input=make('textarea');input.maxLength=4000;input.value=initial[index]||'';input.disabled=state.phase==='closed';label.append(input);journal.append(label);return input;
    });
    const values=()=>fields.map(f=>f.value);
    const save=async complete=>{
      const submitted=values();
      if(complete&&submitted.some(a=>!a.trim()))throw Error('Answer all four required prompts.');
      await update('journal',{file,answers:submitted,complete});
      if(JSON.stringify(values())===JSON.stringify(submitted))sessionStorage.removeItem(draftKey);
      report(complete?'Journal marked complete.':'Draft saved.');
    };
    for(const input of fields)input.oninput=()=>sessionStorage.setItem(draftKey,JSON.stringify(values()));
    if(state.phase!=='closed')journal.append(button('Save draft',()=>save(false)),button('Mark complete',()=>save(true)));
    pane.replaceChildren(make('h3',title),submenu,journal);
  }
  for(const file of player.files){
    const tab=button('Case File '+file,()=>openFile(file));
    tab.dataset.file=file;
    nav.append(tab);
  }
  openFile(player.files.includes(activeFile)?activeFile:player.files[0]);
}
if(isProduct){
  safely(async()=>{
    const materials=await api('product');
    const entry=$('entry');
    entry.append(make('h2','Episode materials'),link('Start Here','start.pdf'),link('Investigation Journals','journals.pdf'));
    for(let i=1;i<=6;i++)entry.append(link('Case File '+i,'case-'+i+'.pdf'));
    entry.append(showText('Briefing transcript',materials.transcript),showText('Music credit',materials.credit));
    for(const clip of materials.clips)entry.append(link(clip.label,clip.filename));
  })();
}else if(isHost){
  $('entry').append(button('Begin Hosting a Live Session',async()=>{const result=await api('create',{});setRoom(result.code);}));
}else{
  const form=make('form');
  const field=(title,value='')=>{const label=make('label',title),input=make('input');input.value=value;label.append(input);form.append(label);return input;};
  const code=field('Six-character room code',room);code.maxLength=6;code.required=true;code.autocapitalize='characters';
  form.append(make('p','Note the room code. After joining, save your private rejoin code if you need to move to another device.'));
  const name=field('Guest name');name.maxLength=60;
  const rejoin=field('Private rejoin code, if returning');rejoin.maxLength=64;rejoin.autocapitalize='characters';rejoin.spellcheck=false;
  const join=make('button','Join Game Room');form.append(join);
  form.onsubmit=safely(async event=>{event.preventDefault();room=code.value.trim().toUpperCase();const result=await api('join',{name:name.value,rejoin:rejoin.value.trim()});setRoom(result.code,result.secret,result.rejoin);});
  $('entry').append(form);
  if(room){secret=sessionStorage.getItem('seasons:'+room)||'';if(secret)setRoom(room,secret,sessionStorage.getItem('seasons-rejoin:'+room)||'');}
}
if(isHost&&room)refresh();
setInterval(()=>{if((isHost&&room)||secret)refresh();},2500);
</script>
</body>
</html>
